# 推上 main 就跑測試。
#
# 注意：這裡「不」負責部署。
# GitHub Pages 已設定為 Deploy from a branch（main / root），
# 由 GitHub 自己在每次推送後直接把 repo 根目錄發佈出去，
# 不需要也不該再有 deploy job（會與分支部署衝突而永遠失敗）。
#
# 因此這個 workflow 的角色是「品質關卡」：
# 測試沒過會在 commit 旁邊打紅叉，提醒不要把壞掉的版本留在 main 上。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 單元測試
        run: node --test tests/*.test.js

      - name: 檢查 sw.js 的 app shell 清單沒有漏檔
        run: node tools/check_shell.mjs
